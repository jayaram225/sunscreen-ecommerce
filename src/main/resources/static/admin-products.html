<!-- admin-products.html -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin - Products</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="header"></div>

<div class="admin-container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2 class="logo">Admin Panel</h2>

        <button onclick="goToAdmin()">Dashboard</button>
        <button class="active" onclick="goToAdminProducts()">Products</button>
        <button onclick="goToAdminOrders()">Orders</button>
        <button onclick="goToUsers()">Users</button>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <div class="page-header">
            <h1>Product Management</h1>
            <p>Add, edit, and monitor product stock</p>
        </div>

        <!-- FORM CARD -->
        <div class="form-card">
            <h3 id="formTitle">Add Product</h3>

            <div class="form-container">
                <input type="text" id="name" placeholder="Product Name">
                <input type="number" id="price" placeholder="Price">
                <input type="number" id="stock" placeholder="Stock">
                <input type="hidden" id="imageUrl">
                <input type="file" id="imageFile">

                <button class="primary-btn" onclick="addProduct()">Save Product</button>
                <button class="secondary-btn" type="button" onclick="resetForm()">Clear</button>
            </div>
        </div>

        <!-- PRODUCT TABLE -->
        <div class="table-card">
            <h3>All Products</h3>

            <div class="search-box">
                <input
                        type="text"
                        id="productSearch"
                        placeholder="Search product..."
                        onkeyup="filterProducts()"
                />
            </div>

            <div class="filter-box">
                <button class="active-filter" onclick="applyProductFilter('ALL', this)">All</button>
                <button onclick="applyProductFilter('ACTIVE', this)">Active</button>
                <button onclick="applyProductFilter('INACTIVE', this)">Inactive</button>
                <button onclick="applyProductFilter('LOW', this)">Low Stock</button>
                <button onclick="applyProductFilter('OUT', this)">Out of Stock</button>
            </div>

            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Image</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="productTable"></tbody>
            </table>
        </div>

    </div>
</div>

<script src="common.js"></script>
<script src="product-admin.js"></script>

</body>
</html>
